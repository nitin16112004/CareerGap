project_id = "careerguid-phase3b-local"

[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54422
shadow_port = 54420
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:8080"
additional_redirect_urls = [
  "http://localhost:8080/auth/callback",
  "http://localhost:8080/verify-email",
  "http://localhost:8080/reset-password",
  "http://localhost:5173/auth/callback",
  "http://localhost:5173/verify-email",
  "http://localhost:5173/reset-password",
]
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true
otp_length = 8
otp_expiry = 600

[auth.email.smtp]
enabled = true
host = "smtp.gmail.com"
port = 465
user = "env(CAREERGUID_LOCAL_SMTP_USER)"
pass = "env(CAREERGUID_LOCAL_SMTP_PASSWORD)"
admin_email = "env(CAREERGUID_LOCAL_SMTP_USER)"
sender_name = "CareerGuid AI"

[auth.email.template.confirmation]
subject = "Verify your CareerGuid AI account"
content_path = "./supabase/templates/confirmation.html"

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
redirect_uri = "http://127.0.0.1:54421/auth/v1/callback"
